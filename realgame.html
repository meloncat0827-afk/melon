                : (hint, callback) => showEnemyReaction(document.getElementById('bossAvatar'), hint, callback);

            runReaction('按下 [空白鍵] 閃避 / 防禦！', (qteRes) => {
                const pAvatar = document.getElementById('playerAvatar');
                const bAvatar = document.getElementById('bossAvatar');
                
                let rawBossDamage = getEnemyDamageValue(qteRes, combatValues.anger);
                if (player.isTaunting) {
                    rawBossDamage = Math.floor(rawBossDamage * 1.25);
                    if (isAnger) {
                        addLog(`😡 敵方因腹黑嘲諷徹底暴怒！傷害額外暴增！`, 'log-danger');
                    }
                }

                let defenseResult = getDefenseResult(player.defenseMode, qteRes, rawBossDamage);
                let finalDamage = defenseResult.damage;
                let reflectDamage = defenseResult.reflect;

                if (player.defenseMode === 'block') {
                    showFeedback('playerChar', `🛡️ 格擋 ${Math.round((1 - finalDamage / rawBossDamage) * 100)}%`, 'fb-great');
                } else if (player.defenseMode === 'dodge') {
                    showFeedback('playerChar', finalDamage === 0 ? '💨 完美閃避!' : '💥 閃避失敗!', finalDamage === 0 ? 'fb-perfect' : 'fb-bad');
                } else if (player.defenseMode === 'counter') {
                    showFeedback('playerChar', `⚔️ 反擊：減傷 ${Math.round((1 - finalDamage / rawBossDamage) * 100)}%`, 'fb-perfect');
                    if (reflectDamage > 0) showFeedback('bossChar', `💥 反彈 -${reflectDamage}`, 'fb-bad');
                }

                if (player.blessingTurns > 0 && finalDamage > 0) {
                    finalDamage = Math.floor(finalDamage * 0.5);
                    player.blessingTurns--;
                }

                if (player.isHardenedActive) finalDamage = 0;

                player.hp = Math.max(0, player.hp - finalDamage);
                if (reflectDamage > 0) {
                    boss.hp = Math.max(0, boss.hp - reflectDamage);
                    bAvatar.classList.add('hit-shake');
                    setTimeout(() => bAvatar.classList.remove('hit-shake'), animationTiming.hitShake);
                }

                if (finalDamage > 0) pAvatar.classList.add('hit-shake');
                    setTimeout(() => pAvatar.classList.remove('hit-shake'), animationTiming.hitShake);

                finishBossTurn();
            });
        }
    }

    function finishBossTurn() {
        // 依次結算召喚的小怪攻擊
        let minionIndex = 0;

        function processNextMinion() {
            if (minionIndex < minions.length) {
                let currentMinion = minions[minionIndex];
                if (!currentMinion.canAttack) {
                    minionIndex++;
                    setTimeout(processNextMinion, animationTiming.minionPause);
                    return;
                }
                if (player.hp > 0) {
                    let m = currentMinion;
                    let minionElement = document.querySelector(`[data-minion-id="${m.id}"]`);
                    showEnemyReaction(minionElement, '👤 小兵襲擊，按空白閃避', (reactionResult) => {
                        let mDmg = getEnemyDamageValue(reactionResult, combatValues.minion);
                        if (m.hp < 3) {
                            mDmg = reactionResult === 'MISS' ? 3 : 0;
                            if (reactionResult === 'MISS') {
                                boss.hp = Math.min(boss.maxHp, boss.hp + 5);
                                addLog(`💥 「${m.name}」自爆失敗，Boss 回復 5 點生命值！`, 'log-danger');
                            } else {
                                addLog(`💨 「${m.name}」自爆被成功閃避！`, 'log-system');
                            }
                        }
                        if (player.defenseMode === 'block') mDmg = Math.floor(mDmg * 0.5);
                        if (player.isHardenedActive) mDmg = 0;
                        player.hp = Math.max(0, player.hp - mDmg);
                        if (mDmg === 0) showFeedback('playerChar', '🛡️ 成功防禦!', 'fb-perfect');
                        addLog(`👤 「${m.name}」偷襲了祈Iruni，造成 ${mDmg} 點傷害！`, 'log-boss');
                        minionIndex++;
                        setTimeout(processNextMinion, animationTiming.minionPause);
                    });
                    return;
                }
                minionIndex++;
                setTimeout(processNextMinion, animationTiming.minionPause);
            } else {
                // 所有敵方（Boss 與所有小怪）都攻擊完畢後，才進行最終結算與釋放選單
                finalizeEnemyTurn();
            }
        }
        processNextMinion();
    }

    function finalizeEnemyTurn() {
        player.defenseMode = null;
        player.isTaunting = false;
        updateDisplay();

        if (boss.hp <= 0) {
            addLog(`🎉 勝利！噩夢陰影被消滅！`, 'system');
            isGameOver = true;
            isActing = true;
            renderMenu();
            return;
        }

        if (player.hp <= 0) {
            addLog(`💀 祈Iruni體力耗盡倒下了...`, 'system');
            triggerDeathSequence();
            return;
        }

        if (bossActionsRemaining > 0) {
            addLog(`👁️ Boss 追加行動！`, 'log-boss');
            setTimeout(() => bossTurn(true), animationTiming.extraTurnPause);
            return;
        }

        addLog(`--- 祈Iruni 的回合 ---`, 'system');

        player.speedActionsLeft = 1;
        if (player.speedStacks > 0) {
            player.speedStacks--;
            player.speedActionsLeft++;
            addLog(`⚡ 疾走狀態生效中！本回合可進行 3 次行動！(剩餘速度層數: ${player.speedStacks})`, 'player');
        } else {
            addLog(`🎤 本回合可進行 2 次行動！`, 'player');
        }

        if (player.isHardenedActive) {
            addLog(`🗿 由於天使硬化結界副作用，祈Iruni本回合調整呼吸無法行動！`, 'system');
            player.speedActionsLeft = 0;
            player.isHardenedActive = false;
            updateDisplay();
            setTimeout(bossTurn, animationTiming.longTurnPause); // 繼續跳過玩家，選單依然維持隱藏
        } else {
            // [安全解鎖] 敵方全員攻擊結束且輪到玩家時，開放選單
            isActing = false;
            renderMenu();
        }
    }

    [
        'BOSS_Idle.webp', 'BOSS_Intro.webp',
        'BOSS_mad1.webp', 'boss_mad2.webp', 'BOSS_mad3.webp',
        'boss_sad1.webp', 'BOSS_sad2.webp', 'BOSS_sad3.webp', 'BOSS_sad4.webp',
        'BOSS_PAIN1.webp', 'BOSS_PAIN2.webp', 'BOSS_PAIN3.webp'
    ].forEach(preloadBossImage);

    createTickers();
    updateDisplay();
</script>
