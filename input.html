  <main class="w-full max-w-2xl mx-auto px-4 py-8 flex-grow flex flex-col items-center justify-center space-y-6">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 🎂 設定祈iruni生日時間 (2026年9月29日 00:00:00)
    const BIRTHDAY_TARGET = new Date('2026-09-29T00:00:00');

    // 全域變數取得與環境設定
    // 1. 填入你從 Firebase 複製的正確設定

import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBkqnAtcZHSUvrxoabWnZDs_MXA6mft62M",
  authDomain: "iruni2026.firebaseapp.com",
  projectId: "iruni2026",
  storageBucket: "iruni2026.firebasestorage.app",
  messagingSenderId: "267905666323",
  appId: "1:267905666323:web:1423cabb5a3e21db641ee6",
  measurementId: "G-PTQ840GJ27"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    // Toast 提示訊息
    window.showToast = function(msg) {
      const toast = document.getElementById('toastMessage');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    };

    // 🗜️ 1. 原生 Gzip 壓縮工具 (字串 -> Base64)
    async function compressText(text) {
      try {
        const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
        const response = new Response(stream);
        const buffer = await response.arrayBuffer();
        return btoa(String.fromCharCode(...new Uint8Array(buffer)));
      } catch (e) {
        console.warn("瀏覽器不支援 CompressionStream，改用標準 Base64 壓縮", e);
        return btoa(encodeURIComponent(text));
      }
    }

    // 🔓 2. 原生 Gzip 解壓縮工具 (Base64 -> 字串)
    async function decompressText(base64Str) {
      try {
        const bytes = Uint8Array.from(atob(base64Str), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const response = new Response(stream);
        return await response.text();
      } catch (e) {
        try {
          return decodeURIComponent(atob(base64Str));
        } catch (err) {
          return base64Str; // 回傳原始文字
        }
      }
    }

    async function initFirebase() {
      if (!firebaseConfig) {
        renderLocalMessages();
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // 登入驗證
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        currentUser = auth.currentUser;

        // 監聽雲端資料庫
        const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'blessings');
        
        onSnapshot(messagesCol, async (snapshot) => {
          const listEl = document.getElementById('cloudMessagesList');
          const countEl = document.getElementById('cloudCount');
          
          if (snapshot.empty) {
            listEl.innerHTML = '<div class="text-center text-slate-400 text-xs py-8">成為第一個打包祝福時空膠囊的觀眾吧！🎉</div>';
            countEl.innerText = '0 則祝福';
            return;
          }

          let messages = [];
          snapshot.forEach((doc) => {
            messages.push({ id: doc.id, ...doc.data() });
          });

          // 依照時間倒序排序
          messages.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

          const isBirthdayPassed = new Date() >= BIRTHDAY_TARGET;
          countEl.innerText = `${messages.length} 則祝福 (${isBirthdayPassed ? '🎉 已解鎖' : '🔒 時空膠囊封印中'})`;

          // 處理每一筆留言的解壓縮與顯示邏輯
          const cardsHTML = await Promise.all(messages.map(async (msg) => {
            let displayContent = "";
            let capsuleTag = "";

            if (msg.isCompressed && msg.compressedContent) {
              if (isBirthdayPassed) {
                // 生日到了！進行解壓縮
                displayContent = await decompressText(msg.compressedContent);
                capsuleTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">✨ 膠囊已解鎖</span>`;
              } else {
                // 生日前：隱藏內容，顯示封印狀態
                displayContent = "🔒 [時空膠囊封印中] 本篇祝福已被壓縮打包，將於 9/29 祈iruni 生日當天自動解開！";
                capsuleTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">🔒 時空膠囊</span>`;
              }
            } else {
              displayContent = msg.content || '';
            }

            return `
              <div class="p-4 rounded-2xl bg-slate-50/80 border border-slate-100 space-y-1.5 transition-all hover:bg-white hover:shadow-sm">
                <div class="flex items-center justify-between text-xs">
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-slate-800">👤 ${escapeHtml(msg.name || '匿名觀眾')}</span>
                    ${capsuleTag}
                  </div>
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-brand-100 text-brand-600">${escapeHtml(msg.level || '一般觀眾')}</span>
                </div>
                <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-wrap ${!isBirthdayPassed && msg.isCompressed ? 'italic text-amber-800 bg-amber-50/60 p-2.5 rounded-xl border border-amber-200/50' : ''}">${escapeHtml(displayContent)}</p>
                <div class="text-[10px] text-slate-400 text-right">${msg.createdAt ? new Date(msg.createdAt).toLocaleString('zh-TW') : ''}</div>
              </div>
            `;
          }));

          listEl.innerHTML = cardsHTML.join('');

        }, (error) => {
          console.error("Firestore read error:", error);
          document.getElementById('cloudMessagesList').innerHTML = '<div class="text-center text-red-400 text-xs py-4">❌ 讀取雲端留言失敗</div>';
        });

      } catch (err) {
        console.error("Firebase init error:", err);
      }
    }

    // HTML 轉義字元防護
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 📱 渲染單機預覽留言列表
    async function renderLocalMessages() {
      const listEl = document.getElementById('cloudMessagesList');
      const countEl = document.getElementById('cloudCount');

      if (localBlessings.length === 0) {
        listEl.innerHTML = '<div class="text-center text-slate-400 text-xs py-8">成為第一個打包祝福時空膠囊的觀眾吧！🎉</div>';
        countEl.innerText = '0 則祝福 (單機預覽)';
        return;
      }

      const isBirthdayPassed = new Date() >= BIRTHDAY_TARGET;
      countEl.innerText = `${localBlessings.length} 則祝福 (${isBirthdayPassed ? '🎉 已解鎖' : '🔒 時空膠囊封印中'})`;

      const cardsHTML = await Promise.all(localBlessings.map(async (msg) => {
        let displayContent = "";
        let capsuleTag = "";

        if (msg.isCompressed && msg.compressedContent) {
          if (isBirthdayPassed) {
            displayContent = await decompressText(msg.compressedContent);
            capsuleTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">✨ 膠囊已解鎖</span>`;
          } else {
            displayContent = "🔒 [時空膠囊封印中] 本篇祝福已被壓縮打包，將於 9/29 祈iruni 生日當天自動解開！";
            capsuleTag = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">🔒 時空膠囊</span>`;
          }
        } else {
          displayContent = msg.content || '';
        }

        return `
          <div class="p-4 rounded-2xl bg-slate-50/80 border border-slate-100 space-y-1.5 transition-all hover:bg-white hover:shadow-sm">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-slate-800">👤 ${escapeHtml(msg.name || '匿名觀眾')}</span>
                ${capsuleTag}
              </div>
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-brand-100 text-brand-600">${escapeHtml(msg.level || '一般觀眾')}</span>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-wrap ${!isBirthdayPassed && msg.isCompressed ? 'italic text-amber-800 bg-amber-50/60 p-2.5 rounded-xl border border-amber-200/50' : ''}">${escapeHtml(displayContent)}</p>
            <div class="text-[10px] text-slate-400 text-right">${msg.createdAt ? new Date(msg.createdAt).toLocaleString('zh-TW') : ''}</div>
          </div>
        `;
      }));

      listEl.innerHTML = cardsHTML.join('');
    }

    // ☁️ 上傳至雲端 (含壓縮封印與單機備用邏輯)
    window.uploadToCloud = async function() {
      const name = document.getElementById('viewerName').value.trim() || "匿名觀眾";
      const level = document.getElementById('memberLevel').value;
      const content = document.getElementById('messageContent').value.trim();

      if (!content) {
        showToast("⚠️ 請先寫下給祈iruni的祝福作文內容！");
        return;
      }

      const cloudBtn = document.getElementById('cloudBtn');
      cloudBtn.disabled = true;
      cloudBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 打包封印壓縮中...`;

      try {
        const isBeforeBirthday = new Date() < BIRTHDAY_TARGET;
        // 1. 將祝福進行 Gzip 壓縮
        const compressedData = await compressText(content);

        // 如果沒有雲端連線環境，切換至單機預覽模式存入記憶體
        if (!db || !currentUser) {
          localBlessings.unshift({
            id: 'local_' + Date.now(),
            name: name,
            level: level,
            content: isBeforeBirthday ? "🔒 [祝福已被生日時空膠囊封印，將於 9/29 祈生日當天解開！]" : content,
            compressedContent: compressedData,
            isCompressed: true,
            createdAt: new Date().toISOString(),
            userId: 'local-user'
          });

          await renderLocalMessages();
          showToast("🎉 祝福已成功壓縮打包至【生日時空膠囊】！");
          document.getElementById('messageContent').value = '';
          return;
        }

        // 有雲端連線時，寫入 Firebase Firestore
        const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'blessings');
        await addDoc(messagesCol, {
          name: name,
          level: level,
          content: isBeforeBirthday ? "🔒 [祝福已被生日時空膠囊封印，將於 9/29 祈生日當天解開！]" : content,
          compressedContent: compressedData,
          isCompressed: true,
          createdAt: new Date().toISOString(),
          userId: currentUser.uid
        });

        showToast("🎉 祝福已成功壓縮打包至【生日時空膠囊】！");
        document.getElementById('messageContent').value = '';
      } catch (err) {
        console.error("Upload error:", err);
        showToast("❌ 上傳失敗，請稍後再試或使用 TXT 匯出。");
      } finally {
        cloudBtn.disabled = false;
        cloudBtn.innerHTML = `<i class="fa-solid fa-box-archive"></i> 封印至生日時空膠囊 (上傳雲端)`;
      }
    };

    // 💾 下載為 TXT 檔案
    window.downloadTXT = function() {
      const name = document.getElementById('viewerName').value.trim() || "匿名觀眾";
      const level = document.getElementById('memberLevel').value;
      const content = document.getElementById('messageContent').value.trim();

      if (!content) {
        showToast("⚠️ 請先寫下給祈iruni的祝福作文內容！");
        return;
      }

      const fileData = `=== 祈iruni 生日祝福作文 ===\n觀眾暱稱：${name}\n會員等級：${level}\n投稿時間：${new Date().toLocaleString('zh-TW')}\n\n【想對祈iruni說的話】\n${content}\n`;

      const blob = new Blob([fileData], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `祈iruni生日祝福_${name}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast("✅ 已成功匯出 TXT 檔案！");
    };

    // 📂 讀取/上傳 TXT 檔案
    window.uploadTXT = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        
        const nameMatch = text.match(/觀眾暱稱：(.*)/);
        const levelMatch = text.match(/會員等級：(.*)/);
        const contentSplit = text.split("【想對祈iruni說的話】\n");

        if (nameMatch && nameMatch[1]) {
          document.getElementById('viewerName').value = nameMatch[1].trim();
        }
        if (levelMatch && levelMatch[1]) {
          const levelVal = levelMatch[1].trim();
          const select = document.getElementById('memberLevel');
          for (let i = 0; i < select.options.length; i++) {
            if (select.options[i].value.includes(levelVal) || levelVal.includes(select.options[i].value)) {
              select.selectedIndex = i;
              break;
            }
          }
        }
        if (contentSplit.length > 1) {
          document.getElementById('messageContent').value = contentSplit[1].trim();
        } else {
          document.getElementById('messageContent').value = text;
        }

        showToast("📂 已成功讀取 TXT 檔案內容！");
      };
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    };

    // 📋 複製內容至剪貼簿
    window.copyText = function() {
      const name = document.getElementById('viewerName').value.trim() || "匿名觀眾";
      const level = document.getElementById('memberLevel').value;
      const content = document.getElementById('messageContent').value.trim();

      if (!content) {
        showToast("⚠️ 沒有可複製的內容！");
        return;
      }

      const textToCopy = `觀眾暱稱：${name}\n會員等級：${level}\n\n${content}`;

      const textarea = document.createElement('textarea');
      textarea.value = textToCopy;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("📋 已成功複製內容到剪貼簿！");
      } catch (err) {
        showToast("❌ 複製失敗，請手動複製。");
      }
      document.body.removeChild(textarea);
    };

    // 初始化 Firebase
    initFirebase();
  </script>
</body>
</html>
