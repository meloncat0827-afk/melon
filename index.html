<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祈魯尼生日倒數</title>
  <style>
    :root {
      --bg-color: #fdf0f5;
      --primary-color: #ff7597;
      --accent-color: #ffb3c6;
      --text-color: #4a3e3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6eb 0%, #edf2ff 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 117, 151, 0.2);
      max-width: 500px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    h1 {
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    /* 倒數計時器樣式 */
    .timer-box {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .time-card {
      background: #fff0f3;
      padding: 12px;
      border-radius: 12px;
      min-width: 65px;
      border: 2px solid var(--accent-color);
    }

    .time-card span {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .time-card .label {
      font-size: 0.75rem;
      color: #888;
    }

    /* 隱藏與顯示區域控制 */
    .hidden {
      display: none !important;
    }

    /* 按鈕樣式 */
    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 117, 151, 0.4);
      transition: all 0.2s ease;
      margin-top: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 117, 151, 0.6);
    }

    /* 遊戲畫布容器 */
    #game-container {
      position: relative;
      margin-top: 20px;
    }

    canvas {
      background: #fff;
      border-radius: 16px;
      border: 3px solid var(--accent-color);
      touch-action: none;
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="container">

        <div class="time-card"><span id="hours">00</span><div class="label">時</div></div>
        <div class="time-card"><span id="minutes">00</span><div class="label">分</div></div>
        <div class="time-card"><span id="seconds">00</span><div class="label">秒</div></div>
      </div>

      </p>
    </div>
  </div>
