<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祈魯尼生日倒數</title>
  <style>
    :root {
      --bg-color: #fdf0f5;
      --primary-color: #ff7597;
      --accent-color: #ffb3c6;
      --text-color: #4a3e3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6eb 0%, #edf2ff 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 頂部彩燈三角旗裝飾 */
    .bunting-banner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: repeating-linear-gradient(
        -45deg,
        #ff7597 0, #ff7597 15px,
        #ffb3c6 15px, #ffb3c6 30px,
        #ffd166 30px, #ffd166 45px,
        #06d6a0 45px, #06d6a0 60px,
        #118ab2 60px, #118ab2 75px
      );
      clip-path: polygon(
        0 0, 100% 0, 100% 60%, 
        95% 100%, 90% 60%, 85% 100%, 80% 60%, 75% 100%, 70% 60%, 
        65% 100%, 60% 60%, 55% 100%, 50% 60%, 45% 100%, 40% 60%, 
        35% 100%, 30% 60%, 25% 100%, 20% 60%, 15% 100%, 10% 60%, 
        5% 100%, 0 60%
      );
      z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* 主要容器 */
    .container {
      background: rgba(255, 255, 255, 0.93);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 117, 151, 0.2);
      max-width: 500px;
      width: 100%;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(5px);
      margin-top: 25px;
    }

    h1 {
      color: var(--primary-color);
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    /* 倒數計時器樣式 */
    .timer-box {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }

    .time-card {
      background: #fff0f3;
      padding: 10px;
      border-radius: 12px;
      min-width: 60px;
      border: 2px solid var(--accent-color);
    }

    .time-card span {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .time-card .label {
      font-size: 0.75rem;
      color: #888;
    }

    .hidden {
      display: none !important;
    }

    /* 按鈕樣式 */
    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 26px;
      font-size: 1.05rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 117, 151, 0.4);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 117, 151, 0.6);
    }

    /* 影片區域 */
    #video-view video {
      width: 100%;
      border-radius: 16px;
      border: 3px solid var(--accent-color);
      margin-top: 15px;
    }

    /* 蛋糕淡入並向上浮現的動畫類別 */
    .float-up {
      animation: floatUpFade 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 蛋糕本體與數字蠟燭 */
    .cake-decoration {
      font-size: 3.8rem;
      margin-bottom: -5px;
      position: relative;
      display: inline-block;
    }

    .candle-number {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff477e;
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff0f3;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1.5px solid #ffb3c6;
    }

    /* 兩側裝飾圖示 */
    .side-deco {
      position: absolute;
      font-size: 2.2rem;
      pointer-events: none;
      animation: sideFloat 3s ease-in-out infinite alternate;
    }
    .deco-left { left: -25px; top: -15px; }
    .deco-right { right: -25px; top: -15px; animation-delay: 1.5s; }

    @keyframes sideFloat {
      0% { transform: translateY(0px) rotate(-5deg); }
      100% { transform: translateY(-8px) rotate(5deg); }
    }

    /* 背景圖片雨 */
    #rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .rain-drop {
      position: absolute;
      top: -80px;
      object-fit: contain;
      pointer-events: none;
      animation: fall linear infinite;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08));
    }

    @keyframes fall {
      0% {
        transform: translateY(0px) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.3;
      }
    }
  </style>
</head>
<body>

  <div class="bunting-banner"></div>
  <div id="rain-container"></div>

  <div class="container">
    <div class="side-deco deco-left">🎁</div>
    <div class="side-deco deco-right">🎈</div>

    <h1>🎉 祈Iruni 生日倒數 🎂</h1>
    <p class="subtitle" id="status-text">距離祈iruni的生日還有：</p>

    <div id="countdown-view">
      <div class="timer-box">
        <div class="time-card"><span id="days">00</span><div class="label">天</div></div>
        <div class="time-card"><span id="hours">00</span><div class="label">時</div></div>
        <div class="time-card"><span id="minutes">00</span><div class="label">分</div></div>
        <div class="time-card"><span id="seconds">00</span><div class="label">秒</div></div>
      </div>
    </div>

    <div id="unlock-section" class="hidden">
      <p style="color: #e63946; font-weight: bold; margin-bottom: 5px;">🎉 驚喜區域已解鎖！</p>
      <button class="btn" id="start-btn" onclick="startVideo()">🎬 點擊觀看特別驚喜</button>
    </div>

    <div id="video-view" class="hidden">
      <video id="birthday-video" controls playsinline preload="auto">
        <source src="2026.mp4" type="video/mp4">
        您的瀏覽器不支援影片播放。
      </video>
    </div>

    <!-- 祝福卡片區域 -->
    <div id="card-view" class="hidden">
      <!-- 蛋糕容器：播放完畢時會套用 float-up 效果浮上來 -->
      <div id="cake-box" class="cake-decoration">
        <div class="candle-number">🎂 20</div>
        🎂
      </div>
      <h2 style="color: var(--primary-color); margin-top: 10px; margin-bottom: 10px;">💖 生日快樂 祈iruni！</h2>
      <p style="line-height: 1.6; text-align: left; background: #fff6f8; padding: 15px; border-radius: 12px;">
        親愛的魯尼：<br><br>
        生日快樂！又過了一年，身為理科腦不太擅長說感性的話，好像也只能說一句生日快樂。不過......希望尼明年也可以打開這個網站！
      </p>
    </div>
  </div>

  <script>
    const BIRTHDAY_DATE = new Date("2026-09-29T00:00:00").getTime();
    const UNLOCK_BEFORE_MS = 90 * 60 * 1000; 

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const unlockSection = document.getElementById('unlock-section');
    const statusText = document.getElementById('status-text');
    const video = document.getElementById('birthday-video');
    const cakeBox = document.getElementById('cake-box');

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = BIRTHDAY_DATE - now;

      if (distance <= UNLOCK_BEFORE_MS && distance > 0) {
        unlockSection.classList.remove('hidden');
      }

      if (distance <= 0) {
        statusText.innerText = "🎂 今天是祈iruni的生日！";
        unlockSection.classList.remove('hidden');
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.innerText = String(Math.max(0, days)).padStart(2, '0');
      hoursEl.innerText = String(Math.max(0, hours)).padStart(2, '0');
      minutesEl.innerText = String(Math.max(0, minutes)).padStart(2, '0');
      secondsEl.innerText = String(Math.max(0, seconds)).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function startVideo() {
      unlockSection.classList.add('hidden');
      document.getElementById('video-view').classList.remove('hidden');

      video.play().catch(error => {
        console.log("需要使用者點擊播放");
      });
    }

    // 當影片結束時，觸發動畫效果
    video.addEventListener('ended', () => {
      document.getElementById('video-view').classList.add('hidden');
      document.getElementById('card-view').classList.remove('hidden');
      
      // 給蛋糕加上浮現動畫
      cakeBox.classList.add('float-up');
    });

    // 動態產生圖片雨
    const rainContainer = document.getElementById('rain-container');
    const TOTAL_DROPS = 25;

    for (let i = 0; i < TOTAL_DROPS; i++) {
      const img = document.createElement('img');
      const randomImgNum = Math.floor(Math.random() * 6) + 1;
      img.src = `iruni${randomImgNum}.png`;
      img.classList.add('rain-drop');

      const leftPos = Math.random() * 100;
      const size = Math.random() * 35 + 35;
      const duration = Math.random() * 4 + 3;
      const delay = Math.random() * 5;

      img.style.left = `${leftPos}vw`;
      img.style.width = `${size}px`;
      img.style.height = `${size}px`;
      img.style.animationDuration = `${duration}s`;
      img.style.animationDelay = `${delay}s`;

      rainContainer.appendChild(img);
    }
  </script>
</body>
</html>
