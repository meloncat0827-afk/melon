<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祈iruni 🎂 生日倒數首頁</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff0f3',
              100: '#ffe1e8',
              200: '#ffc2d1',
              400: '#ff7597',
              500: '#ff4d7d',
              600: '#e62e60',
            },
            husky: {
              50: '#f0f4f8',
              100: '#dbe3ed',
              200: '#b8c7d9',
              500: '#5a738e',
              600: '#435870',
              700: '#324356',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            display: ['"Fredoka"', 'cursive'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #ffeef2 0%, #f0f4ff 50%, #f1f5f9 100%);
      min-height: 100vh;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 40px rgba(255, 117, 151, 0.12);
    }

    .card-hover-iruni {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover-iruni:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 15px 30px rgba(255, 77, 125, 0.25);
    }

    .card-hover-husky {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover-husky:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 15px 30px rgba(90, 115, 142, 0.25);
    }
  </style>
</head>
<body class="text-slate-700 font-sans flex flex-col justify-between min-h-screen">

  <main class="w-full max-w-4xl mx-auto px-4 py-6 flex-grow flex items-center justify-center">

    <section class="w-full max-w-xl glass-card rounded-3xl p-6 md:p-8 text-center space-y-6">
      
      <!-- 轉址提示區塊 -->
      <div id="redirect-notice" class="hidden text-xs md:text-sm bg-amber-50 text-amber-700 p-3 rounded-xl border border-amber-200 font-semibold animate-pulse">
        🚀 選擇身分...
      </div>

      <!-- 身份問答標題 -->
      <div>
        <h2 class="text-xl md:text-2xl font-extrabold text-slate-800 flex items-center justify-center gap-2">
          <span>🤔</span> 請問你是 <b>祈iruni</b> 還是 <b>觀眾 (哈士祈)</b>？
        </h2>
        <p class="text-xs text-slate-400 mt-1.5">請選擇您的身份進入專屬體驗區：</p>
      </div>

      <!-- 身份選擇雙按鈕區 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
        
        <!-- 我是 祈iruni：超連結導向 game.html -->
        <a href="game.html" class="card-hover-iruni block p-6 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-600 text-white text-left relative overflow-hidden group shadow-md flex items-center justify-between">
          <div>
            <span class="text-[10px] tracking-wider text-brand-100 font-bold block uppercase">Party Host</span>
            <h3 class="font-bold text-lg leading-tight mt-1">我是 祈iruni</h3>
          </div>
          <i class="fa-solid fa-chevron-right text-brand-200 group-hover:translate-x-1 transition-transform"></i>
        </a>

        <!-- 我是 觀眾 (哈士祈)：超連結導向 input.html -->
        <a href="input.html" class="card-hover-husky block p-6 rounded-2xl bg-gradient-to-br from-husky-600 to-husky-700 text-white text-left relative overflow-hidden group shadow-md flex items-center justify-between">
          <div>
            <span class="text-[10px] tracking-wider text-husky-200 font-bold block uppercase">Fan & Audience</span>
            <h3 class="font-bold text-lg leading-tight mt-1">我是 觀眾 (哈士祈)</h3>
          </div>
          <i class="fa-solid fa-chevron-right text-husky-200 group-hover:translate-x-1 transition-transform"></i>
        </a>

      </div>

    </section>

  </main>

  <footer class="w-full text-center py-4 text-xs text-slate-400">
    🎂 Happy Birthday to 祈iruni | Made with ❤️ for Birthday Celebration
  </footer>

  <script>
    const TARGET_DATE = new Date('2026-08-06T00:00:00'); 
    let redirected = false;

    function updateCountdown() {
      const now = new Date();
      const diff = TARGET_DATE - now;

      // 當到達指定時間時，顯示提示並自動跳轉至 game.html
      if (diff <= 0 && !redirected) {
        redirected = true;
        const noticeEl = document.getElementById('redirect-notice');
        if (noticeEl) noticeEl.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = "game.html";
        }, 1500);
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
