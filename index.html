<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>接收終端 </title>
    <style>
        body {
            background-color: #030708;
            color: #a3e2ff;
            font-family: "Courier New", Courier, monospace, "Noto Serif TC";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .beeper-case {
            background: #0f1c24;
            border: 4px solid #1e3a47;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 162, 255, 0.2);
            position: relative;
        }

        .beeper-header {
            font-size: 0.8rem;
            color: #528fa8;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e3a47;
            padding-bottom: 5px;
        }

        .screen {
            background: #07131a;
            border: 2px solid #254b5c;
            border-radius: 6px;
            min-height: 180px;
            padding: 15px;
            box-shadow: inset 0 0 15px rgba(0, 162, 255, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .prescript-text {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #c2efff;
            text-shadow: 0 0 8px rgba(0, 162, 255, 0.6);
            margin: 0;
            z-index: 1;
        }

        .highlight {
            color: #ffffff;
            border-bottom: 1px dashed #00a2ff;
            padding: 0 2px;
        }

        /* 讓每個字預設隱藏，當加上 .revealed 時才顯示 */
        .char {
            opacity: 0;
            display: inline-block;
            transition: opacity 0.05s ease;
        }

        .char.revealed {
            opacity: 1;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-receive {
            background: #132b38;
            border: 2px solid #00a2ff;
            color: #00a2ff;
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(0, 162, 255, 0.2);
            transition: all 0.1s ease;
        }

        .btn-receive:disabled {
            border-color: #1e3a47;
            color: #1e3a47;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-receive:active:not(:disabled) {
            background: #00a2ff;
            color: #051118;
            box-shadow: 0 0 15px #00a2ff;
        }

        .printing {
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="beeper-case">
    <div class="beeper-header">
        <span>PROXIMA_TERMINAL_V2.04</span>
        <span id="status-light" style="color: #00a2ff;">● ONLINE</span>
    </div>
    
    <div class="screen">
        <div id="prescript-box">
            <p style="color: #436d80; text-align: center; font-size: 0.9rem;">[ 點擊下方按鈕以接收線條意志 ]</p>
        </div>
    </div>
    
    <div class="controls">
        <span style="font-size: 0.7rem; color: #3a5e6e;">INDEX MFG.</span>
        <button onclick="receiveOracle()" id="receive-btn" class="btn-receive">✉ RECEIVE</button>
    </div>
</div>

<script>
    const data = {
        times: ["在空無一物的時刻", "當第十三聲蟬鳴響起時", "在血液凝固的溫度下", "當影子長過本體之時", "在被遺忘的夢境邊緣", "於尚未命名的色彩中"],
        verbs: ["編織", "抹除", "親吻", "拆解", "凝視", "咀嚼", "雕刻", "縫補"],
        senses: ["未曾存在的", "正在腐爛的", "不可直視的", "被奪走名字的", "散發鐵鏽味的", "透明的"],
        names: ["虛無", "螺旋", "線條的末端", "昨日的餘溫", "所有人的沈默", "齒輪的喘息", "褪色的誓言"],
        abstract_prefix: ["為了證明服從，你必須", "以都市之名，准許你", "在苦難的盡頭，請務必", "這是不容置疑的意志："],
        requirements: ["保持呼吸的韻律與時鐘同步", "將眼球轉向不存在的方位", "用指尖感受重力的重量", "在心中默唸不存在的數字"]
    };

    function getRandom(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    // 將字串包裝成一個個帶有 .char 類別的 span，以此保留高亮標籤又能做逐字動畫
    function wrapTextInSpans(text, isHighlight = false) {
        return text.split('').map(char => {
            const hClass = isHighlight ? 'highlight' : '';
            return `<span class="char ${hClass}">${char}</span>`;
        }).join('');
    }

    function receiveOracle() {
        const box = document.getElementById('prescript-box');
        const status = document.getElementById('status-light');
        const btn = document.getElementById('receive-btn');
        
        // 停用按鈕，避免在打字時重複觸發
        btn.disabled = true;
        status.innerText = "▲ RECEIVING...";
        status.style.color = "#ffcc00";
        box.innerHTML = `<p style="color: #00a2ff; text-align: center;" class="printing">正在解調線條信號...</p>`;

        setTimeout(() => {
            status.innerText = "● PRINTING";
            status.style.color = "#00ffff";

            const structureType = Math.random();
            let htmlContent = '';

            if (structureType > 0.5) {
                htmlContent = `
                    <p class="prescript-text">
                        ${wrapTextInSpans(getRandom(data.times), true)}，
                        ${wrapTextInSpans(getRandom(data.verbs), true)}你
                        ${wrapTextInSpans(getRandom(data.senses), true)}的
                        ${wrapTextInSpans(getRandom(data.names), true)}。
                    </p>
                `;
            } else {
                htmlContent = `
                    <p class="prescript-text">
                        ${wrapTextInSpans(getRandom(data.abstract_prefix), true)}
                        ${wrapTextInSpans(getRandom(data.requirements), true)}，並
                        ${wrapTextInSpans(getRandom(data.verbs), true)}
                        ${wrapTextInSpans(getRandom(data.names), true)}。
                    </p>
                `;
            }

            box.innerHTML = htmlContent;

            // 執行逐字顯示邏輯
            const chars = box.querySelectorAll('.char');
            let index = 0;
            
            // 調整這個數字可以改變滾動速度（毫秒/字）
            const typingSpeed = 70; 

            const ticker = setInterval(() => {
                if (index < chars.length) {
                    chars[index].classList.add('revealed');
                    index++;
                } else {
                    clearInterval(ticker);
                    // 結束打字，恢復狀態
                    status.innerText = "● RECEIVED";
                    status.style.color = "#00a2ff";
                    btn.disabled = false;
                }
            }, typingSpeed);

        }, 400);
    }
</script>

</body>
</html>
