<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祈魯尼生日倒數</title>
  <style>
    :root {
      --primary-color: #ff7597;
      --accent-color: #ffb3c6;
      --text-color: #4a3e3d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: linear-gradient(135deg, #ffe6eb 0%, #edf2ff 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 滿版頂部橫幅 */
    .top-banner {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: auto; max-height: 200px;
      object-fit: cover; object-position: top center;
      z-index: 15; pointer-events: none;
    }

    /* 低語文字容器 (不影響滑鼠點擊) */
    #whisper-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    /* 隨機出現的低語單字樣式 */
    .whisper-text {
      position: absolute;
      white-space: nowrap;
      font-weight: 900;
      user-select: none;
      pointer-events: none;
      animation: whisperFade 4s ease-out forwards;
      letter-spacing: 2px;
    }

    /* 低語出現與淡出動畫 */
    @keyframes whisperFade {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.8);
      }
      20% {
        opacity: var(--max-opacity, 0.6);
      }
      80% {
        opacity: var(--max-opacity, 0.6);
      }
      100% {
        opacity: 0;
        transform: translate(var(--move-x, 0px), var(--move-y, -20px)) scale(1.05);
      }
    }

    /* 背景氣球 */
    .balloon-deco {
      position: absolute; width: 90px; height: auto;
      pointer-events: none; z-index: 2;
      animation: floatBalloon 4s ease-in-out infinite alternate;
    }
    .b-left-1 { left: 4%; top: 18%; animation-delay: 0s; }
    .b-left-2 { left: 10%; top: 45%; animation-delay: 1.5s; width: 110px; }
    .b-left-3 { left: 2%; top: 70%; animation-delay: 0.8s; }
    .b-right-1 { right: 4%; top: 20%; animation-delay: 1s; }
    .b-right-2 { right: 9%; top: 50%; animation-delay: 2.2s; width: 105px; }

    @keyframes floatBalloon {
      0% { transform: translateY(0px) rotate(-4deg); }
      100% { transform: translateY(-18px) rotate(4deg); }
    }

    /* 主卡片容器 */
    .container {
      background: rgba(255, 255, 255, 0.93);
      padding: 40px 30px 50px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 117, 151, 0.2);
      max-width: 520px; width: 100%;
      position: relative; z-index: 10;
      backdrop-filter: blur(5px);
      margin-top: 120px;
    }

    /* 角落禮物盒 */
    .gift-deco {
      position: absolute; bottom: -30px; width: 95px; height: auto;
      z-index: 12; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
      pointer-events: none;
    }
    .gift-1 { left: -40px; }
    .gift-2 { left: 50px; bottom: -35px; width: 80px; }
    .gift-3 { right: -40px; }

    h1 { color: var(--primary-color); margin-bottom: 8px; font-size: 1.9rem; }
    .subtitle { color: #777; margin-bottom: 20px; font-size: 1rem; }

    /* 倒數計時樣式 */
    .timer-box { display: flex; justify-content: space-around; margin: 15px 0; }
    .time-card {
      background: #fff0f3; padding: 12px; border-radius: 12px;
      min-width: 65px; border: 2px solid var(--accent-color);
    }
    .time-card span { display: block; font-size: 1.8rem; font-weight: bold; color: var(--primary-color); }
    .time-card .label { font-size: 0.8rem; color: #888; }

    .hidden { display: none !important; }

    .btn {
      background: var(--primary-color); color: white; border: none;
      padding: 14px 28px; font-size: 1.1rem; border-radius: 50px;
      cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 117, 151, 0.4);
      transition: all 0.2s ease; margin-top: 15px; text-decoration: none;
      display: inline-block;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 117, 151, 0.6); }

    /* 背景圖片雨 */
    #rain-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
    .rain-drop { position: absolute; top: -120px; pointer-events: none; animation: fall linear infinite; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08)); }
    @keyframes fall {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(115vh) rotate(360deg); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- 頂部橫幅 -->
  <img src="banner.png" alt="Banner" class="top-banner">

  <!-- 低語文字容器 -->
  <div id="whisper-container"></div>

  <!-- 背景氣球 -->
  <img src="balloon1.png" class="balloon-deco b-left-1" alt="Balloon 1">
  <img src="balloon2.png" class="balloon-deco b-left-2" alt="Balloon 2">
  <img src="balloon3.png" class="balloon-deco b-left-3" alt="Balloon 3">
  <img src="balloon4.png" class="balloon-deco b-right-1" alt="Balloon 4">
  <img src="balloon5.png" class="balloon-deco b-right-2" alt="Balloon 5">

  <div id="rain-container"></div>

  <!-- 主卡片 -->
  <div class="container">
    <img src="gift1.png" class="gift-deco gift-1" alt="Gift 1">
    <img src="gift2.png" class="gift-deco gift-2" alt="Gift 2">
    <img src="gift3.png" class="gift-deco gift-3" alt="Gift 3">

    <h1>🎉 祈Iruni 生日倒數 🎂</h1>
    <p class="subtitle" id="status-text">距離祈iruni的生日還有：</p>

    <div id="countdown-view">
      <div class="timer-box">
        <div class="time-card"><span id="days">00</span><div class="label">天</div></div>
        <div class="time-card"><span id="hours">00</span><div class="label">時</div></div>
        <div class="time-card"><span id="minutes">00</span><div class="label">分</div></div>
        <div class="time-card"><span id="seconds">00</span><div class="label">秒</div></div>
      </div>
    </div>

    <!-- 解鎖按鈕區 -->
    <div id="unlock-section" class="hidden">
      <p style="color: #e63946; font-weight: bold; margin-top: 10px;">🎉 生日小驚喜已開放！</p>
      <a href="game.html" class="btn">🎮 點擊前往農場小遊戲</a>
    </div>
  </div>

  <script>
    const BIRTHDAY_DATE = new Date("2026-09-29T00:00:01").getTime();
    const UNLOCK_BEFORE_MS = 90 * 60 * 1000; // 倒數最後 1.5 小時

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const unlockSection = document.getElementById('unlock-section');
    const statusText = document.getElementById('status-text');

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = BIRTHDAY_DATE - now;

      if (distance <= UNLOCK_BEFORE_MS) {
        unlockSection.classList.remove('hidden');
      }

      if (distance <= 0) {
        statusText.innerText = "🎂 今天是祈iruni的生日！";
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.innerText = String(Math.max(0, days)).padStart(2, '0');
      hoursEl.innerText = String(Math.max(0, hours)).padStart(2, '0');
      minutesEl.innerText = String(Math.max(0, minutes)).padStart(2, '0');
      secondsEl.innerText = String(Math.max(0, seconds)).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ----------------------------------------------------
    // 低語隨機生成系統 (1~2秒隨機挑選、無序隨機出現)
    // ----------------------------------------------------
    const whisperPhrases = [
      "生日快樂~~",
      "最後一個半小時?",
      "好期待...",
      "會是什麼呢?",
      "還要多久呢?"
    ];

    const whisperColors = [
      "rgba(255, 117, 151, ",
      "rgba(255, 179, 198, ",
      "rgba(230, 57, 70, ",
      "rgba(180, 100, 200, "
    ];

    const whisperContainer = document.getElementById('whisper-container');

    function spawnWhisper() {
      const el = document.createElement('div');
      el.classList.add('whisper-text');
      
      // 1. 隨機挑選句子
      const text = whisperPhrases[Math.floor(Math.random() * whisperPhrases.length)];
      el.innerText = text;

      // 2. 隨機大小 (1.2rem ~ 2.6rem)
      const fontSize = (Math.random() * 1.4 + 1.2).toFixed(1);
      el.style.fontSize = `${fontSize}rem`;

      // 3. 隨機色彩與不透明度 (0.3 ~ 0.6)
      const colorPrefix = whisperColors[Math.floor(Math.random() * whisperColors.length)];
      const maxOpacity = (Math.random() * 0.3 + 0.3).toFixed(2);
      el.style.color = `${colorPrefix}${maxOpacity})`;
      el.style.setProperty('--max-opacity', maxOpacity);

      // 隨機文字陰影 glow
      el.style.textShadow = `0 0 8px ${colorPrefix}0.4)`;

      // 4. 隨機位置 (避免貼太邊緣)
      const posX = Math.random() * 80 + 10; // 10vw ~ 90vw
      const posY = Math.random() * 80 + 10; // 10vh ~ 90vh
      el.style.left = `${posX}vw`;
      el.style.top = `${posY}vh`;

      // 5. 隨機漂移方向 (-40px ~ 40px)
      const moveX = (Math.random() * 80 - 40).toFixed(0);
      const moveY = (Math.random() * 80 - 40).toFixed(0);
      el.style.setProperty('--move-x', `${moveX}px`);
      el.style.setProperty('--move-y', `${moveY}px`);

      whisperContainer.appendChild(el);

      // 動畫結束後自動銷毀 DOM 節點，防止佔用記憶體
      setTimeout(() => {
        el.remove();
      }, 4000);

      // 設定下一次生成的隨機時間 (1000ms ~ 2000ms 之間)
      const nextDelay = Math.floor(Math.random() * 1000) + 1000;
      setTimeout(spawnWhisper, nextDelay);
    }

    // 啟動低語系統
    spawnWhisper();

    // 圖片雨生成
    const rainContainer = document.getElementById('rain-container');
    for (let i = 0; i < 25; i++) {
      const img = document.createElement('img');
      img.src = `iruni${Math.floor(Math.random() * 6) + 1}.png`;
      img.classList.add('rain-drop');
      const size = Math.random() * 50 + 60;
      img.style.left = `${Math.random() * 100}vw`;
      img.style.width = `${size}px`;
      img.style.height = `${size}px`;
      img.style.animationDuration = `${Math.random() * 4 + 3.5}s`;
      img.style.animationDelay = `${Math.random() * 5}s`;
      rainContainer.appendChild(img);
    }
  </script>
</body>
</html>
