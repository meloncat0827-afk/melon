<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>接收終端 </title>
    <style>
        body {
            background-color: #030708;
            color: #a3e2ff;
            font-family: "Courier New", Courier, monospace, "Noto Serif TC";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .beeper-case {
            background: #0f1c24;
            border: 4px solid #1e3a47;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 162, 255, 0.2);
            position: relative;
        }

        .beeper-header {
            font-size: 0.8rem;
            color: #528fa8;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e3a47;
            padding-bottom: 5px;
        }

        .screen {
            background: #07131a;
            border: 2px solid #254b5c;
            border-radius: 6px;
            min-height: 200px;
            padding: 15px;
            box-shadow: inset 0 0 15px rgba(0, 162, 255, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .prescript-text {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #c2efff;
            text-shadow: 0 0 8px rgba(0, 162, 255, 0.6);
            margin: 0;
            z-index: 1;
            letter-spacing: 1px;
        }

        .highlight {
            color: #ffffff;
            border-bottom: 1px dashed #00a2ff;
            padding: 0 2px;
        }

        .char {
            opacity: 0;
            display: inline-block;
            transition: opacity 0.03s ease;
        }

        .char.revealed {
            opacity: 1;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-receive {
            background: #132b38;
            border: 2px solid #00a2ff;
            color: #00a2ff;
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(0, 162, 255, 0.2);
            transition: all 0.1s ease;
        }

        .btn-receive:disabled {
            border-color: #1e3a47;
            color: #1e3a47;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-receive:active:not(:disabled) {
            background: #00a2ff;
            color: #051118;
            box-shadow: 0 0 15px #00a2ff;
        }

        .printing {
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="beeper-case">
    <div class="beeper-header">
        <span>METRO_TERMINAL_V5.50</span>
        <span id="status-light" style="color: #00a2ff;">● ONLINE</span>
    </div>
    
    <div class="screen">
        <div id="prescript-box">
            <p style="color: #436d80; text-align: center; font-size: 0.9rem;">[ 點擊按鈕，接收指令 ]</p>
        </div>
    </div>
    
    <div class="controls">
        <span style="font-size: 0.7rem; color: #3a5e6e;">INDEX INDUSTRIAL.</span>
        <button onclick="receiveOracle()" id="receive-btn" class="btn-receive">✉ RECEIVE</button>
    </div>
</div>

<script>
    const data = {
        // 【時間/狀態】 (擴充並修正至 50+ 現實與都市怪談情境)
        times: [
            "當下班鐘聲響起時", "在捷運門即將關上的瞬間", "當手機電量僅剩1%時", "在便利商店大夜班交接時", 
            "當垃圾車音樂從遠處傳來時", "在打開免洗筷的瞬間", "當週一早上的鬧鐘響起第三次時", "在對發票卻全部沒中的時刻",
            "當陰影投射在牆面時", "當空間扭曲達到臨界點時", "當面臨抉擇時", "當執行計畫時", "當擦肩而過時", 
            "當心跳加速時", "當怒火中燒時", "當失去理智時", "黑夜降臨時代替所有人時", "當時鐘定格時", 
            "日落西山時", "黑夜降臨時代碼重構時", "黎明初現時", "四季更迭時", "流星劃過天際時", 
            "冰雪消融時", "櫻花盛開時", "暴雨傾盆時", "霓虹閃爍在街角時", "狂風驟起時", "迷霧籠罩觀測站時", 
            "潮汐退去時", "雷電交加時", "大地震動時", "靈感湧現時", "意識模糊時", "恐懼蔓延時", 
            "孤獨襲來時", "記憶復甦時", "意志堅定時", "希望破滅時", "真相大白時", "靈魂共鳴時", 
            "抵達終點時", "按下主機開關時", "拔得頭籌時", "陷入沉思時", "陷入無底絕境時", "跨越肉體極限時", 
            "遭遇無法戰勝的強敵時", "握緊顫抖的雙手時", "轉身冷酷離去時", "迎風瘋狂奔跑時", "能量耗盡核心熄滅時", 
            "城市秩序崩塌時", "底層系統重啟時", "既有規則失效時", "光芒徹底黯淡時", "高維數據溢出時", 
            "沉睡的古神甦醒時", "兩個世界產生重疊時"
        ],
        // 【動詞】 (修正語法錯誤，去重，保留生活感與怪談操作)
        verbs: [
            "解除分期付款", "封鎖", "按讚分享", "截圖存證", "取消追蹤", "強制打卡", "雙擊點讚", 
            "退群組", "瘋狂重新整理", "悄悄關注", "複製貼上", "投遞履歷", "全面優化", "精準投放", 
            "學習", "思考", "執行", "計劃", "閱讀", "寫作", "觀察", "想像", "跑步", "游泳",
            "飛翔", "超越", "控制", "創造", "改變", "發展", "溝通", "分享", "聚集", "選擇",
            "決定", "喜歡", "討厭", "感謝", "抱怨", "準備", "忘記", "記得", "發現", "發明",
            "解決", "破壞", "建立", "改善", "影響", "增加", "減少", "獲得", "失去", "拒絕",
            "接受", "承諾", "懷疑", "相信", "堅持", "放棄", "追求", "等待", "期待", "珍惜"
        ],
        // 【形容詞/感官】 (擴充至 50 個，修正分類錯誤)
        adjectives: [
            "過期三天的", "充滿香精味的", "顯示為已讀的", "高流量的", "藍光外洩的", "脆化的", 
            "極度缺鈣的", "被演算法推薦的", "沒訊號的", "散發微波食品氣味的", "高畫質的", "充滿社畜怨氣的",
            "優秀的", "聰明的", "善良的", "美麗的", "快樂的", "悲傷的", "憤怒的", "緊張的", "放鬆的", "疲憊的",
            "充實的", "積極的", "消極的", "敏捷的", "勇敢的", "謹慎的", "溫柔的", "嚴肅的", "幽默的", "瘋狂的",
            "精彩的", "無聊的", "幸運的", "倒楣的", "自由的", "受限制的", "複雜的", "單純的", "獨特的", "普遍的",
            "理智的", "迷茫的", "堅定的", "脆弱的", "強大的", "遙遠的", "接近的", "真實的", "虛幻的", "黑暗的",
            "明亮的", "沉重的", "輕盈的", "溫暖的", "寒冷的", "神秘的", "巨大的", "微小的", "核心的", "未知的"
        ],
        // 【名詞】 (修正與形容詞混雜的錯誤，確保都是物品/身份/概念)
        names: [
            "外送員", "垃圾分類桶", "悠遊卡", "大冰奶", "藍牙耳機", "演算法", "限時動態", "Wi-Fi密碼", 
            "Excel表格", "群組訊息", "載具條碼", "主管的來電", "迷因圖", "動態磚", "超商熱狗",
            "世界", "社會", "自然", "宇宙", "時間", "空間", "命運", "機會", "挑戰", "目標", 
            "責任", "經驗", "知識", "科技", "核心", "系統", "數據", "資訊", "能量", "物質", 
            "光芒", "陰影", "秘密", "奇蹟", "現象", "規律", "記憶", "邏輯", "靈感", "意識", 
            "常理", "本質", "結構", "秩序", "混亂", "財富", "智慧", "情感", "環境", "音樂", 
            "藝術", "程式碼", "遊戲關卡", "故事線", "歷史紀錄", "未來", "現在", "過去", "夢想", "現實"
        ],
        // 【特殊句型前綴與要求】
        abstract_prefix: ["為了維持社會秩序，你必須", "依循都市KPI，命令你", "這是不可忤逆的勞工合約："],
        requirements: ["保持雙眼直視螢幕不眨眼", "用滑鼠游標在桌面上畫出完美圓形", "在心中默唸退職申請書", "將呼吸頻率調整為冷氣機的運作節奏"]
    };

    function getRandom(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    function wrapTextInSpans(text, isHighlight = false) {
        return text.split('').map(char => {
            const hClass = isHighlight ? 'highlight' : '';
            return `<span class="char ${hClass}">${char}</span>`;
        }).join('');
    }

    function receiveOracle() {
        const box = document.getElementById('prescript-box');
        const status = document.getElementById('status-light');
        const btn = document.getElementById('receive-btn');
        
        btn.disabled = true;
        status.innerText = "▲ CONNECTING...";
        status.style.color = "#ffcc00";
        box.innerHTML = `<p style="color: #00a2ff; text-align: center;" class="printing">正在從基地台下載線條代碼...</p>`;

        setTimeout(() => {
            status.innerText = "● PRINTING";
            status.style.color = "#00ffff";

            const structureType = Math.random();
            let htmlContent = '';

            if (structureType > 0.4) {
                // 結構 A：現實分格式 (時間 + 動詞 + 形容詞 + 名詞)
                htmlContent = `
                    <p class="prescript-text">
                        ${wrapTextInSpans(getRandom(data.times), true)}，
                        填空要求：請${wrapTextInSpans(getRandom(data.verbs), true)}你
                        ${wrapTextInSpans(getRandom(data.adjectives), true)}
                        ${wrapTextInSpans(getRandom(data.names), true)}。
                    </p>
                `;
            } else {
                // 結構 B：現代苦行式 (前綴 + 現實要求的抽象化)
                htmlContent = `
                    <p class="prescript-text">
                        ${wrapTextInSpans(getRandom(data.abstract_prefix), true)}
                        ${wrapTextInSpans(getRandom(data.requirements), true)}，並立即
                        ${wrapTextInSpans(getRandom(data.verbs), true)}那份
                        ${wrapTextInSpans(getRandom(data.names), true)}。
                    </p>
                `;
            }

            box.innerHTML = htmlContent;

            const chars = box.querySelectorAll('.char');
            let index = 0;
            const typingSpeed = 40; // 稍微微調打字速度

            const ticker = setInterval(() => {
                if (index < chars.length) {
                    chars[index].classList.add('revealed');
                    index++;
                } else {
                    clearInterval(ticker);
                    status.innerText = "● RECEIVED";
                    status.style.color = "#00a2ff";
                    btn.disabled = false;
                }
            }, typingSpeed);

        }, 400);
    }
</script>

</body>
</html>
