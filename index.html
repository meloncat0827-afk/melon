<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祈魯尼生日倒數</title>
  <style>
    :root {
      --bg-color: #fdf0f5;
      --primary-color: #ff7597;
      --accent-color: #ffb3c6;
      --text-color: #4a3e3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6eb 0%, #edf2ff 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 117, 151, 0.2);
      max-width: 500px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    h1 {
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    /* 倒數計時器樣式 */
    .timer-box {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .time-card {
      background: #fff0f3;
      padding: 12px;
      border-radius: 12px;
      min-width: 65px;
      border: 2px solid var(--accent-color);
    }

    .time-card span {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .time-card .label {
      font-size: 0.75rem;
      color: #888;
    }

    /* 隱藏與顯示區域控制 */
    .hidden {
      display: none !important;
    }

    /* 按鈕樣式 */
    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 117, 151, 0.4);
      transition: all 0.2s ease;
      margin-top: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 117, 151, 0.6);
    }

    /* 遊戲畫布容器 */
    #game-container {
      position: relative;
      margin-top: 20px;
    }

    canvas {
      background: #fff;
      border-radius: 16px;
      border: 3px solid var(--accent-color);
      touch-action: none;
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 祈Iruni 生日倒數 🎂</h1>
    <p class="subtitle" id="status-text">距離祈iruni的生日還有：</p>

    <!-- 倒數計時視圖 -->
    <div id="countdown-view">
      <div class="timer-box">
        <div class="time-card"><span id="days">00</span><div class="label">天</div></div>
        <div class="time-card"><span id="hours">00</span><div class="label">時</div></div>
        <div class="time-card"><span id="minutes">00</span><div class="label">分</div></div>
        <div class="time-card"><span id="seconds">00</span><div class="label">秒</div></div>
      </div>
    </div>

    <!-- 提前 1.5 小時解鎖的驚喜按鈕區域 -->
    <div id="unlock-section" class="hidden">
      <p style="color: #e63946; font-weight: bold; margin-bottom: 10px;">驚喜區域已解鎖！</p>
      <button class="btn" onclick="startGame()">🎮 開始小遊戲</button>
    </div>

    <!-- 小遊戲區域 -->
    <div id="game-view" class="hidden">
      <div class="game-stats">
        <span>得分: <span id="score">0</span> / 10</span>
        <span>目標: 10 個蛋糕</span>
      </div>
      <div id="game-container">
        <canvas id="gameCanvas" width="320" height="350"></canvas>
      </div>
      <p style="font-size: 0.85rem; color: #888; margin-top: 8px;">左右移動滑鼠或用手指拖曳底部籃子來接蛋糕！</p>
    </div>

    <!-- 通關/生日祝福卡片 -->
    <div id="card-view" class="hidden">
      <h2 style="color: var(--primary-color); margin-bottom: 15px;">💖 生日快樂 祈iruni！</h2>
      <p style="line-height: 1.6; text-align: left; background: #fff6f8; padding: 15px; border-radius: 12px;">
        親愛的魯尼：<br><br>
        生日快樂！又過了一年，身為理科腦不太擅長說感性的話，好像也只能說一句生日快樂。不過......希望尼明年也可以打開這個網站！
      </p>
    </div>
  </div>

  <script>
    // 設定生日時間
    const BIRTHDAY_DATE = new Date("2026-09-29T00:00:00").getTime();
    
    // 提前 1.5 小時解鎖 (90 分鐘)
    const UNLOCK_BEFORE_MS = 90 * 60 * 1000; 

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const unlockSection = document.getElementById('unlock-section');
    const statusText = document.getElementById('status-text');

    // 倒數計時邏輯
    function updateCountdown() {
      const now = new Date().getTime();
      const distance = BIRTHDAY_DATE - now;

      // 檢查是否到達解鎖時間 (提前 1.5 小時)
      if (distance <= UNLOCK_BEFORE_MS && distance > 0) {
        unlockSection.classList.remove('hidden');
      }

      if (distance < 0) {
        statusText.innerText = "🎂 今天是祈iruni的生日！";
        document.getElementById('countdown-view').classList.add('hidden');
        unlockSection.classList.remove('hidden');
        return;
      }

      // 計算剩餘天、時、分、秒
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.innerText = String(days).padStart(2, '0');
      hoursEl.innerText = String(hours).padStart(2, '0');
      minutesEl.innerText = String(minutes).padStart(2, '0');
      secondsEl.innerText = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // 遊戲邏輯
    let canvas, ctx;
    let score = 0;
    let basket = { x: 130, width: 60, height: 15 };
    let cake = { x: 100, y: 0, speed: 3, size: 20 };

    function startGame() {
      document.getElementById('unlock-section').classList.add('hidden');
      document.getElementById('countdown-view').classList.add('hidden');
      document.getElementById('game-view').classList.remove('hidden');

      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');

      // 滑鼠與觸控監聽
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        basket.x = e.clientX - rect.left - basket.width / 2;
      });

      canvas.addEventListener('touchmove', (e) => {
        const rect = canvas.getBoundingClientRect();
        basket.x = e.touches[0].clientX - rect.left - basket.width / 2;
        e.preventDefault();
      });

      resetCake();
      requestAnimationFrame(gameLoop);
    }

    function resetCake() {
      cake.x = Math.random() * (canvas.width - cake.size);
      cake.y = 0;
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 移動與繪製蛋糕
      cake.y += cake.speed;
      ctx.font = "20px Sans-serif";
      ctx.fillText("🎂", cake.x, cake.y);

      // 繪製籃子
      ctx.fillStyle = "#ff7597";
      ctx.beginPath();
      ctx.roundRect(basket.x, canvas.height - basket.height - 10, basket.width, basket.height, 8);
      ctx.fill();

      // 碰撞偵測 (接住蛋糕)
      if (
        cake.y >= canvas.height - basket.height - 20 &&
        cake.x + cake.size >= basket.x &&
        cake.x <= basket.x + basket.width
      ) {
        score++;
        document.getElementById('score').innerText = score;
        if (score >= 10) {
          // 通關顯示卡片
          document.getElementById('game-view').classList.add('hidden');
          document.getElementById('card-view').classList.remove('hidden');
          return;
        }
        resetCake();
      }

      // 沒接到，掉落地面重置
      if (cake.y > canvas.height) {
        resetCake();
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
