<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkqnAtcZHSUVrxoabWnZDs_MXA6mft62M",
      authDomain: "iruni2026.firebaseapp.com",
      projectId: "iruni2026",
      storageBucket: "iruni2026.firebasestorage.app",
      messagingSenderId: "267905666323",
      appId: "1:267905666323:web:1423cabb5a3e21db641ee6",
      measurementId: "G-PTQ840GJ27"
    };

    // --- 全域變數宣告 ---
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const analytics = getAnalytics(app);
    const appId = "default_app_id"; // 請務必確認此 ID 與你發送資料時的 path 一致
    
    let allMessages = [];
    let pendingDeleteTarget = null;
    let currentUser = null;

    // (中間的 decompressText, showToast, checkAdminPassword 函式保持不變)

    // --- 修正後的 initFirebase ---
    async function initFirebase() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        currentUser = auth.currentUser;

        // 正確的路徑：確保此處的路徑與發送端完全一致
        const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'blessings');

        onSnapshot(messagesCol, async (snapshot) => {
          allMessages = [];
          snapshot.forEach((d) => {
            allMessages.push({ id: d.id, ...d.data() });
          });

          allMessages.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

          for (let m of allMessages) {
            if (m.isCompressed && m.compressedContent) {
              m.adminDecryptedContent = await decompressText(m.compressedContent);
            } else {
              m.adminDecryptedContent = m.content || '';
            }
          }
          updateStats();
          filterMessages();
        });
      } catch (err) {
        console.error("Firebase init error:", err);
      }
    }

    // --- 修正後的刪除邏輯 ---
    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (!pendingDeleteTarget) return;

      const btn = document.getElementById('confirmDeleteBtn');
      btn.disabled = true;
      btn.innerText = "刪除中...";

      try {
        if (pendingDeleteTarget.type === 'single') {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'blessings', pendingDeleteTarget.id));
          showToast("🗑️ 已成功刪除文章！");
        } else if (pendingDeleteTarget.type === 'batch') {
          const promises = pendingDeleteTarget.ids.map(id => 
            deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'blessings', id))
          );
          await Promise.all(promises);
          showToast(`🗑️ 已成功刪除 ${pendingDeleteTarget.ids.length} 篇勾選文章！`);
        }
      } catch (err) {
        console.error("Delete error:", err);
        showToast("❌ 刪除失敗，請檢查網路或權限。");
      } finally {
        btn.disabled = false;
        btn.innerText = "確認刪除";
        closeDeleteModal();
      }
    });

    initFirebase();
  </script>
